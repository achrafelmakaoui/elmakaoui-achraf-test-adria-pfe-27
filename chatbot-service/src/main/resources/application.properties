spring.application.name=chatbot-service
server.port=8085
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.options.model=${GEMINI_MODEL:gemini-3.8-flash}
spring.ai.mcp.client.streamable-http.connections.account.url=${ACCOUNT_MCP_URL:http://localhost:8081/mcp}
spring.ai.mcp.client.streamable-http.connections.transaction.url=${TRANSACTION_MCP_URL:http://localhost:8082/mcp}
discord.token=${DISCORD_BOT_TOKEN:}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
logging.level.io.modelcontextprotocol=DEBUG
logging.level.org.springframework.ai.mcp=DEBUG