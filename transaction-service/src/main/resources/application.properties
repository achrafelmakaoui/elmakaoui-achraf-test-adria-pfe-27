spring.application.name=transaction-service
server.port=8082
spring.config.import=optional:configserver:${CONFIG_URL:http://localhost:8888}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
spring.datasource.url=jdbc:h2:mem:transactiondb
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=3000
bank.kafka.topic=bank.transactions.created
spring.graphql.path=/api/transactions/graphql
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/api/transactions/graphiql
spring.ai.mcp.server.name=transaction-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
management.endpoints.web.exposure.include=health,info,metrics,prometheus,refresh
management.endpoint.health.probes.enabled=true
