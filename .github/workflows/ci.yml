name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/adria

jobs:
  # 1) compilation + 2) tests
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile
        run: mvn -B -DskipTests compile
      - name: Unit tests
        run: mvn -B test
      - name: Package
        run: mvn -B -DskipTests package

  # 3) image build + 4) publication in the registry (only on main)
  docker:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module: [discovery-service, config-service, gateway-service, account-service,
                 transaction-service, transaction-consumer, chatbot-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: MODULE=${{ matrix.module }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.module }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.module }}:latest

  # 5) deployment (schematic: no real cloud is requested)
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy (schematic)
        run: |
          echo "On a real server this step would run, over SSH:"
          echo "  IMAGE_TAG=${{ github.sha }} docker compose pull && docker compose up -d"
          echo "Secrets (GEMINI_API_KEY, ...) come from the GitHub 'staging' environment secrets."
