spring.application.name=account-service
server.port=8081
spring.config.import=optional:configserver:${CONFIG_URL:http://localhost:8888}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
spring.datasource.url=jdbc:h2:mem:accountdb
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.graphql.path=/api/accounts/graphql
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/api/accounts/graphiql
spring.ai.mcp.server.name=account-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
