# Start everything:   docker compose up --build
# Secrets come from a local .env file (NOT committed): see .env.example
name: adria-bank

x-service: &service
  restart: unless-stopped
  networks: [bank]

services:
  kafka:
    <<: *service
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  discovery-service:
    <<: *service
    build: { context: ., args: { MODULE: discovery-service } }
    image: adria/discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    healthcheck: &hc
      test: ["CMD-SHELL", "curl -fs http://localhost:$$SERVER_PORT/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    environment:
      SERVER_PORT: 8761

  config-service:
    <<: *service
    build: { context: ., args: { MODULE: config-service } }
    image: adria/config-service
    container_name: config-service
    ports:
      - "8888:8888"
    healthcheck: *hc
    environment:
      SERVER_PORT: 8888

  account-service:
    <<: *service
    build: { context: ., args: { MODULE: account-service } }
    image: adria/account-service
    container_name: account-service
    ports:
      - "8081:8081"
    healthcheck: *hc
    environment:
      SERVER_PORT: 8081
      EUREKA_URL: http://discovery-service:8761/eureka
      CONFIG_URL: http://config-service:8888
    depends_on:
      discovery-service: { condition: service_healthy }
      config-service: { condition: service_healthy }

  transaction-service:
    <<: *service
    build: { context: ., args: { MODULE: transaction-service } }
    image: adria/transaction-service
    container_name: transaction-service
    ports:
      - "8082:8082"
    healthcheck: *hc
    environment:
      SERVER_PORT: 8082
      EUREKA_URL: http://discovery-service:8761/eureka
      CONFIG_URL: http://config-service:8888
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      discovery-service: { condition: service_healthy }
      config-service: { condition: service_healthy }
      kafka: { condition: service_healthy }
      account-service: { condition: service_healthy }

  transaction-consumer:
    <<: *service
    build: { context: ., args: { MODULE: transaction-consumer } }
    image: adria/transaction-consumer
    container_name: transaction-consumer
    healthcheck: *hc
    environment:
      SERVER_PORT: 8083
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      kafka: { condition: service_healthy }

  gateway-service:
    <<: *service
    build: { context: ., args: { MODULE: gateway-service } }
    image: adria/gateway-service
    container_name: gateway-service
    ports:
      - "8080:8080"
    healthcheck: *hc
    environment:
      SERVER_PORT: 8080
      EUREKA_URL: http://discovery-service:8761/eureka
    depends_on:
      discovery-service: { condition: service_healthy }

  chatbot-service:
    <<: *service
    build: { context: ., args: { MODULE: chatbot-service } }
    image: adria/chatbot-service
    container_name: chatbot-service
    ports:
      - "8085:8085"
    healthcheck: *hc
    environment:
      SERVER_PORT: 8085
      EUREKA_URL: http://discovery-service:8761/eureka
      ACCOUNT_MCP_URL: http://account-service:8081/mcp
      TRANSACTION_MCP_URL: http://transaction-service:8082/mcp
      # secrets: read from the shell / .env file, never written in this file
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in your .env file}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
    depends_on:
      account-service: { condition: service_healthy }
      transaction-service: { condition: service_healthy }
      discovery-service: { condition: service_healthy }

networks:
  bank:
